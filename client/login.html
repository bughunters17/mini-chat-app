<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('mc_theme') === 'light' ? 'light' : 'dark';
  </script>
  <title>MessenCharles Login</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="login-stage">
    <section class="liquid-panel login-screen" aria-labelledby="login-title">
      <div class="login-card-header">
        <span class="app-mark" aria-hidden="true">M</span>
        <div>
          <h2 id="login-title">MessenCharles</h2>
          <p>Private chat sign in</p>
        </div>
      </div>

      <div class="login-form">
        <label for="username">
          Username
          <input id="username" autocomplete="username" placeholder="Enter username" />
        </label>
        <label for="password">
          Password
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" />
        </label>
        <button id="login-btn" class="login-btn" type="button">Login</button>
        <a class="auth-link" href="register.html">Create a new account</a>
        <p class="error" id="error" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script type="module">
    import { login } from './js/login.js';

    const loginButton = document.getElementById('login-btn');
    const passwordInput = document.getElementById('password');

    loginButton.addEventListener('click', login);
    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
